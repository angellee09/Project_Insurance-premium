<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>專案計畫人員保費查詢系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f3f6fa;color:#243447}
.header{background:#12385b;color:#fff;padding:24px 20px;text-align:center}.header h1{margin:0;font-size:28px;letter-spacing:1px}
.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.card{background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:11px 12px;border:1px solid #cbd5df;border-radius:7px;font-size:16px}.hint{margin-top:7px;color:#596b7d;font-size:13px}
.notice{margin:18px 0 14px;text-align:center;color:#9a5b00;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:11px 22px;font-size:16px;cursor:pointer}.primary{background:#12385b;color:#fff}.secondary{background:#527a9f;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{margin:22px 0 14px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:15px}.summary strong{color:#12385b}.table-wrap{overflow:auto}table.result{width:100%;border-collapse:collapse;background:#fff}table.result th,table.result td{border:1px solid #d7dee6;padding:9px 7px;text-align:center;vertical-align:middle}.no-wrap{white-space:nowrap}table.result th{background:#e9f0f6;color:#12385b}table.result tr:nth-child(even){background:#fafcfe}.total-row{font-weight:700;background:#eef4f8!important}.empty{text-align:center;padding:35px;color:#687888}
@media(max-width:800px){.grid{grid-template-columns:1fr}.header h1{font-size:23px}}
</style>
</head>
<body>
<div class="header"><h1>專案計畫人員保費查詢系統</h1></div>
<div class="wrap"><div class="card">
<div class="grid">
<div class="field"><label for="handler">業務承辦人</label><input id="handler" placeholder="例如：1234" autocomplete="off"><div class="hint">請輸入業務承辦人身分證號後4碼及保險年月查詢</div></div>
<div class="field"><label for="start">起始保險年月</label><input id="start" type="month"><div class="hint">例如：2026年08月</div></div>
<div class="field"><label for="end">結束保險年月</label><input id="end" type="month"><div class="hint">例如：2026年08月</div></div>
</div>
<div class="notice">當月保險費請於次月月底查詢，例如115年1月保險費於115年2月底可提供查詢。</div>
<div class="actions"><button class="btn primary" onclick="doQuery()">查詢</button><button class="btn secondary" id="excelBtn" onclick="exportExcel()" disabled>匯出 Excel</button><button class="btn secondary" id="wordBtn" onclick="exportAllocationDocx()" disabled>匯出支出科目分攤表</button><button class="btn secondary" onclick="openBudgetPdf()">薪級及保險費預算表</button></div>
<div id="summary" class="summary"></div><div id="result" class="table-wrap"><div class="empty">請輸入查詢條件後按「查詢」</div></div>
</div></div>
<script>
let rows=[];let lastResults=[];
const DATA_FILE='./專案計畫人員保費查詢.xlsx';
function norm(v){return String(v??'').trim().toLowerCase()}
function monthValue(v){let s=String(v??'').trim().replace(/[^0-9]/g,'');if(!s)return null;let y,m;if(s.length===5){y=+s.slice(0,3);m=+s.slice(3)}else if(s.length===6&&s.slice(0,3)==='000'){y=+s.slice(0,3);m=+s.slice(3)}else{y=+s.slice(0,3);m=+s.slice(-2)}return m>=1&&m<=12?y*100+m:null}
function fmtMonth(v){let n=monthValue(v);return n?String(Math.floor(n/100)).padStart(3,'0')+'年'+String(n%100).padStart(2,'0')+'月':''}
function inputMonthValue(v){if(!v)return null;let [gy,m]=v.split('-').map(Number);return (gy-1911)*100+m}
function num(v){if(v==null||v==='')return 0;let n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0}
function money(n){return Math.round(num(n)).toLocaleString('en-US')}
function loadData(){return fetch(DATA_FILE+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('無法讀取 Excel 資料檔');return r.arrayBuffer()}).then(b=>{let wb=XLSX.read(b,{type:'array'});let ws=wb.Sheets['資料頁'];if(!ws)throw new Error('找不到「資料頁」工作表');rows=XLSX.utils.sheet_to_json(ws,{defval:''});})}
function doQuery(){
 const h=norm(document.getElementById('handler').value), s=inputMonthValue(document.getElementById('start').value), e=inputMonthValue(document.getElementById('end').value);
 if(!h){alert('請輸入業務承辦人身分證號後4碼。');return} if(s&&e&&s>e){alert('起始保險年月不可晚於結束保險年月。');return}
 loadData().then(()=>{lastResults=rows.filter(r=>norm(r['業務承辦人證號'])===h).filter(r=>{let mv=monthValue(r['保險年月']);return mv!=null&&(!s||mv>=s)&&(!e||mv<=e)});render();}).catch(err=>alert(err.message));
}
function render(){
 document.getElementById('excelBtn').disabled=!lastResults.length;document.getElementById('wordBtn').disabled=!lastResults.length;
 if(!lastResults.length){document.getElementById('summary').innerHTML='';document.getElementById('result').innerHTML='<div class="empty">查無符合條件的資料。</div>';return}
 const name=lastResults.find(r=>String(r['業務承辦人姓名']||'').trim())?.['業務承辦人姓名']||'';
 const lb=lastResults.reduce((a,r)=>a+num(r['勞工保險費']),0),rt=lastResults.reduce((a,r)=>a+num(r['勞工退休金提繳']),0),hi=lastResults.reduce((a,r)=>a+num(r['全民健康保險費']),0);
 document.getElementById('summary').innerHTML=`業務承辦人：<strong>${esc(name)}</strong>　資料筆數：<strong>${lastResults.length}</strong>　勞保費：<strong>${money(lb)}</strong>　勞退提繳：<strong>${money(rt)}</strong>　健保費：<strong>${money(hi)}</strong>　合計：<strong>${money(lb+rt+hi)}</strong>`;
 let html='<table class="result"><thead><tr><th>序號</th><th>單位</th><th>姓名</th><th>保險年月</th><th>投保薪額</th><th>勞工保險費</th><th>勞工退休金提繳</th><th>全民健康保險費</th><th>異動</th><th>備註</th><th>計畫名稱</th></tr></thead><tbody>';
 lastResults.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${esc(r['單位'])}</td><td class="no-wrap">${esc(r['姓名'])}</td><td class="no-wrap">${fmtMonth(r['保險年月'])}</td><td class="no-wrap">${money(r['投保薪額'])}</td><td class="no-wrap">${money(r['勞工保險費'])}</td><td class="no-wrap">${money(r['勞工退休金提繳'])}</td><td class="no-wrap">${money(r['全民健康保險費'])}</td><td>${esc(r['異動'])}</td><td>${esc(r['備註'])}</td><td>${esc(r['計畫名稱'])}</td></tr>`});
 html+=`</tbody></table>`;document.getElementById('result').innerHTML=html;
}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function exportExcel(){if(!lastResults.length)return;let out=lastResults.map((r,i)=>{let x={...r};x['序號']=i+1;return x});let ws=XLSX.utils.json_to_sheet(out);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'查詢結果');XLSX.writeFile(wb,'專案計畫人員保費查詢結果.xlsx')}
function chineseMoney(n){
 n=Math.round(num(n));if(n===0)return'零元整';const d=['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];const units=['','拾','佰','仟'];
 function section(x){let s='',zero=false;for(let i=0;i<4;i++){let q=x%10;x=Math.floor(x/10);if(q){s=d[q]+units[i]+s;zero=false}else if(s&&!zero){s='零'+s;zero=true}}return s.replace(/^零/,'').replace(/零+/g,'零').replace(/零$/,'')}
 let yi=Math.floor(n/100000000),wan=Math.floor((n%100000000)/10000),yuan=n%10000,s='';if(yi)s+=section(yi)+'億';if(wan)s+=(yi&&wan<1000?'零':'')+section(wan)+'萬';if(yuan)s+=((yi||wan)&&yuan<1000?'零':'')+section(yuan);return s+'元整';
}
async function exportAllocationDocx(){
 if(!lastResults.length)return;
 try{
  const groups=new Map();
  lastResults.forEach(r=>{
   const month=fmtMonth(r['保險年月']);
   const project=String(r['計畫名稱']??'').trim();
   const key=month+'||'+project;
   if(!groups.has(key))groups.set(key,[]);
   groups.get(key).push(r);
  });

  const resp=await fetch('./支出科目分攤表範本.docx?'+Date.now());
  if(!resp.ok)throw new Error('無法讀取支出科目分攤表範本。');
  const templateBytes=await resp.arrayBuffer();
  const zip=await JSZip.loadAsync(templateBytes);
  const documentFile=zip.file('word/document.xml');
  if(!documentFile)throw new Error('Word 範本缺少 word/document.xml。');
  const xml=await documentFile.async('string');
  const parser=new DOMParser();
  const xmlDoc=parser.parseFromString(xml,'application/xml');
  if(xmlDoc.getElementsByTagName('parsererror').length)throw new Error('Word 範本 XML 無法解析。');
  const body=xmlDoc.getElementsByTagNameNS(WNS_MAIN,'body')[0];
  if(!body)throw new Error('Word 範本找不到文件本文。');
  const sect=body.lastElementChild;
  const base=Array.from(body.childNodes).filter(n=>n!==sect).map(n=>n.cloneNode(true));
  while(body.firstChild)body.removeChild(body.firstChild);

  const groupsArr=Array.from(groups.values());
  groupsArr.forEach((g,idx)=>{
   const month=fmtMonth(g[0]['保險年月']);
   const project=String(g[0]['計畫名稱']??'').trim();
   const lb=g.reduce((a,r)=>a+num(r['勞工保險費']),0);
   const rt=g.reduce((a,r)=>a+num(r['勞工退休金提繳']),0);
   const hi=g.reduce((a,r)=>a+num(r['全民健康保險費']),0);
   const total=lb+rt+hi;
   const clones=base.map(n=>n.cloneNode(true));
   replaceTemplate(clones,xmlDoc,month,total,project,lb,rt,hi);
   clones.forEach(n=>body.appendChild(n));
   if(idx<groupsArr.length-1){
    const pageP=xmlDoc.createElementNS(WNS_MAIN,'w:p');
    const pageR=xmlDoc.createElementNS(WNS_MAIN,'w:r');
    const br=xmlDoc.createElementNS(WNS_MAIN,'w:br');
    br.setAttributeNS(WNS_MAIN,'w:type','page');
    pageR.appendChild(br);pageP.appendChild(pageR);body.appendChild(pageP);
   }
  });
  if(sect)body.appendChild(sect.cloneNode(true));

  const out=new XMLSerializer().serializeToString(xmlDoc);
  zip.file('word/document.xml',out);
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
  downloadBlob(blob,'支出科目分攤表.docx');
 }catch(e){
  console.error(e);
  alert('匯出支出科目分攤表失敗：'+(e&&e.message?e.message:e));
 }
}

const WNS_MAIN='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const XMLNS='http://www.w3.org/XML/1998/namespace';
function wElements(node,localName){
 return Array.from(node.getElementsByTagNameNS(WNS_MAIN,localName));
}
function wText(node){return wElements(node,'t').map(t=>t.textContent||'').join('');}
function firstW(node,localName){return wElements(node,localName)[0]||null;}
function ensureTextRun(xmlDoc,p,referenceRun){
 let r=Array.from(p.getElementsByTagNameNS(WNS_MAIN,'r'))[0]||null;
 if(!r){
  r=xmlDoc.createElementNS(WNS_MAIN,'w:r');
  if(referenceRun){
   const rp=firstW(referenceRun,'rPr');
   if(rp)r.appendChild(rp.cloneNode(true));
  }
  p.appendChild(r);
 }
 let t=Array.from(r.getElementsByTagNameNS(WNS_MAIN,'t'))[0]||null;
 if(!t){t=xmlDoc.createElementNS(WNS_MAIN,'w:t');r.appendChild(t);}
 return t;
}
function setCellText(xmlDoc,cell,value,referenceCell){
 const p=Array.from(cell.getElementsByTagNameNS(WNS_MAIN,'p'))[0];
 if(!p)return false;
 const refRun=referenceCell?Array.from(referenceCell.getElementsByTagNameNS(WNS_MAIN,'r'))[0]:null;
 // 保留段落、對齊、框線、列高等格式，只清除原文字內容。
 Array.from(p.getElementsByTagNameNS(WNS_MAIN,'t')).forEach(t=>t.textContent='');
 const t=ensureTextRun(xmlDoc,p,refRun);
 t.textContent=String(value??'');
 if(/^\s|\s$/.test(String(value??'')))t.setAttributeNS(XMLNS,'xml:space','preserve');
 return true;
}
function appendRunToParagraph(xmlDoc,p,value,referenceRun){
 const r=xmlDoc.createElementNS(WNS_MAIN,'w:r');
 if(referenceRun){
  const rp=firstW(referenceRun,'rPr');
  if(rp)r.appendChild(rp.cloneNode(true));
 }
 const t=xmlDoc.createElementNS(WNS_MAIN,'w:t');
 t.textContent=String(value??'');
 if(/^\s|\s$/.test(String(value??'')))t.setAttributeNS(XMLNS,'xml:space','preserve');
 r.appendChild(t);p.appendChild(r);
}
function replaceTemplate(nodes,xmlDoc,month,total,project,lb,rt,hi){
 const tables=[];
 function walk(n){
  if(n.nodeType===1 && n.namespaceURI===WNS_MAIN && n.localName==='tbl')tables.push(n);
  Array.from(n.childNodes||[]).forEach(walk);
 }
 nodes.forEach(walk);
 const tbl=tables[0];
 if(!tbl)throw new Error('Word 範本找不到主要表格。');
 const rows=Array.from(tbl.getElementsByTagNameNS(WNS_MAIN,'tr'));
 if(rows.length<10)throw new Error('Word 範本表格結構與預期不同。');
 const cells=row=>Array.from(row.getElementsByTagNameNS(WNS_MAIN,'tc')).filter(tc=>tc.parentNode===row);
 const r3=cells(rows[3]);
 const y=month.slice(0,3),m=month.slice(4,6);

 // 表頭：所屬年度月份。範本空白資料格位於第4列第2格。
 if(r3[0]&&r3[1]){
  const labelP=Array.from(r3[0].getElementsByTagNameNS(WNS_MAIN,'p'))[0];
  const targetP=Array.from(r3[1].getElementsByTagNameNS(WNS_MAIN,'p'))[0];
  if(labelP&&targetP){
   const refRun=Array.from(labelP.getElementsByTagNameNS(WNS_MAIN,'r'))[0];
   setCellText(xmlDoc,r3[1],y+'年'+m+'月',r3[0]);
  }
 }
 // 表頭：總金額。範本空白資料格位於第4列第4格。
 if(r3[2]&&r3[3])setCellText(xmlDoc,r3[3],money(total),r3[2]);

 // 資料列：第6～8列；第3欄為用途別科目名稱、第4欄為金額。
 const data=[['勞保費',money(lb)],['勞退提繳',money(rt)],['健保費',money(hi)]];
 data.forEach((item,i)=>{
  const cs=cells(rows[6+i]);
  if(cs[2])setCellText(xmlDoc,cs[2],item[0],cs[2]);
  if(cs[3])setCellText(xmlDoc,cs[3],item[1],cs[3]);
 });

 // 計畫名稱：範本第6～8列的第2欄為垂直合併儲存格；只填一次。
 const row6=cells(rows[6]);
 if(row6[1])setCellText(xmlDoc,row6[1],project,row6[1]);

 // 底部合計中文大寫：第10列第1、2格合併區域。
 const r9=cells(rows[9]);
 if(r9[0]&&r9[1])setCellText(xmlDoc,r9[1],chineseMoney(total),r9[0]);
}

function openBudgetPdf(){
 const w=window.open('./薪級及保險費預算表.pdf','_blank');
 if(!w) alert('瀏覽器封鎖了新視窗，請允許本網站開啟新視窗後再試。');
}

function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
</script></body></html>
