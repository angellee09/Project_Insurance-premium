<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>專案計畫人員保費查詢系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f3f6fa;color:#243447}
.header{background:#12385b;color:#fff;padding:24px 20px;text-align:center}.header h1{margin:0;font-size:28px;letter-spacing:1px}
.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.card{background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:11px 12px;border:1px solid #cbd5df;border-radius:7px;font-size:16px}.hint{margin-top:7px;color:#596b7d;font-size:13px}
.notice{margin:18px 0 14px;text-align:center;color:#9a5b00;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:11px 22px;font-size:16px;cursor:pointer}.primary{background:#12385b;color:#fff}.secondary{background:#527a9f;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{margin:22px 0 14px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:15px}.summary strong{color:#12385b}.table-wrap{overflow:auto}table.result{width:100%;border-collapse:collapse;background:#fff}table.result th,table.result td{border:1px solid #d7dee6;padding:9px 7px;text-align:center;vertical-align:middle}.no-wrap{white-space:nowrap}table.result th{background:#e9f0f6;color:#12385b}table.result tr:nth-child(even){background:#fafcfe}.total-row{font-weight:700;background:#eef4f8!important}.empty{text-align:center;padding:35px;color:#687888}
@media(max-width:800px){.grid{grid-template-columns:1fr}.header h1{font-size:23px}}
</style>
</head>
<body>
<div class="header"><h1>專案計畫人員保費查詢系統</h1></div>
<div class="wrap"><div class="card">
<div class="grid">
<div class="field"><label for="handler">業務承辦人</label><input id="handler" placeholder="例如：1234" autocomplete="off"><div class="hint">請輸入業務承辦人身分證號後4碼及保險年月查詢</div></div>
<div class="field"><label for="start">起始保險年月</label><input id="start" type="month"><div class="hint">例如：2026年08月</div></div>
<div class="field"><label for="end">結束保險年月</label><input id="end" type="month"><div class="hint">例如：2026年08月</div></div>
</div>
<div class="notice">當月保險費請於次月月底查詢，例如115年1月保險費於115年2月底可提供查詢。</div>
<div class="actions"><button class="btn primary" onclick="doQuery()">查詢</button><button class="btn secondary" id="excelBtn" onclick="exportExcel()" disabled>匯出 Excel</button><button class="btn secondary" id="wordBtn" onclick="exportAllocationDocx()" disabled>匯出支出科目分攤表</button><button class="btn secondary" onclick="openBudgetPdf()">薪級及保險費預算表</button></div>
<div id="summary" class="summary"></div><div id="result" class="table-wrap"><div class="empty">請輸入查詢條件後按「查詢」</div></div>
</div></div>
<script>
let rows=[];let lastResults=[];let lastHandlerCodes=[];
const DATA_FILE='./專案計畫人員保費查詢.xlsx';
function norm(v){return String(v??'').trim().toLowerCase()}
function handlerTokens(v){return String(v??'').split(/[\s,，、;；]+/).map(norm).filter(Boolean)}
function monthValue(v){let s=String(v??'').trim().replace(/[^0-9]/g,'');if(!s)return null;let y,m;if(s.length===5){y=+s.slice(0,3);m=+s.slice(3)}else if(s.length===6&&s.slice(0,3)==='000'){y=+s.slice(0,3);m=+s.slice(3)}else{y=+s.slice(0,3);m=+s.slice(-2)}return m>=1&&m<=12?y*100+m:null}
function fmtMonth(v){let n=monthValue(v);return n?String(Math.floor(n/100)).padStart(3,'0')+'年'+String(n%100).padStart(2,'0')+'月':''}
function inputMonthValue(v){if(!v)return null;let [gy,m]=v.split('-').map(Number);return (gy-1911)*100+m}
function num(v){if(v==null||v==='')return 0;let n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0}
function money(n){return Math.round(num(n)).toLocaleString('en-US')}
function loadData(){return fetch(DATA_FILE+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('無法讀取 Excel 資料檔');return r.arrayBuffer()}).then(b=>{let wb=XLSX.read(b,{type:'array'});let ws=wb.Sheets['資料頁'];if(!ws)throw new Error('找不到「資料頁」工作表');rows=XLSX.utils.sheet_to_json(ws,{defval:''});})}
function doQuery(){
 const rawH=document.getElementById('handler').value; const hs=rawH.split(/[\s,，、;；]+/).map(norm).filter(Boolean), s=inputMonthValue(document.getElementById('start').value), e=inputMonthValue(document.getElementById('end').value);
 if(!hs.length){alert('請輸入業務承辦人身分證號後4碼。');return} if(s&&e&&s>e){alert('起始保險年月不可晚於結束保險年月。');return}
 loadData().then(()=>{lastHandlerCodes=hs;lastResults=rows.filter(r=>handlerTokens(r['業務承辦人證號']).some(code=>hs.includes(code))).filter(r=>{let mv=monthValue(r['保險年月']);return mv!=null&&(!s||mv>=s)&&(!e||mv<=e)});render();}).catch(err=>alert(err.message));
}
function getSelectedHandlerNames(){
 const names=[];
 lastResults.forEach(r=>{
   const codes=handlerTokens(r['業務承辦人證號']);
   const ns=handlerTokens(r['業務承辦人姓名']);
   codes.forEach((code,i)=>{
     if(lastHandlerCodes.includes(code)){
       const nm=String(ns[i]??'').trim();
       if(nm&&!names.includes(nm)) names.push(nm);
     }
   });
 });
 return names.join('、');
}
function insuranceLabel(v){return String(v??'').trim()}
function render(){
 document.getElementById('excelBtn').disabled=!lastResults.length;
 document.getElementById('wordBtn').disabled=!lastResults.length;
 if(!lastResults.length){document.getElementById('summary').innerHTML='';document.getElementById('result').innerHTML='<div class="empty">查無符合條件的資料。</div>';return}
 const handlerName=getSelectedHandlerNames();
 const total=lastResults.reduce((a,r)=>a+num(r['雇主負擔保費']),0);
 const byItem=new Map();
 lastResults.forEach(r=>{const k=insuranceLabel(r['保險項目']);byItem.set(k,(byItem.get(k)||0)+num(r['雇主負擔保費']));});
 const itemSummary=Array.from(byItem.entries()).map(([k,v])=>`${k}：${money(v)}`).join('　');
 document.getElementById('summary').innerHTML=`業務承辦人：<strong>${esc(handlerName)}</strong>　資料筆數：<strong>${lastResults.length}</strong>　${esc(itemSummary)}　合計：<strong>${money(total)}</strong>`;
 let html='<table class="result"><thead><tr><th>序號</th><th>單位</th><th>姓名</th><th>保險年月</th><th>保險項目</th><th>投保薪額</th><th>雇主負擔保費</th><th>異動</th><th>備註</th><th>預算編號</th><th>計畫名稱</th></tr></thead><tbody>';
 lastResults.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${esc(r['單位'])}</td><td class="no-wrap">${esc(r['姓名'])}</td><td class="no-wrap">${fmtMonth(r['保險年月'])}</td><td>${esc(r['保險項目'])}</td><td class="no-wrap">${money(r['投保薪額'])}</td><td class="no-wrap">${money(r['雇主負擔保費'])}</td><td>${esc(r['異動'])}</td><td>${esc(r['備註'])}</td><td class="no-wrap">${esc(r['預算編號'])}</td><td>${esc(r['計畫名稱'])}</td></tr>`});
 html+=`</tbody></table>`;document.getElementById('result').innerHTML=html;
}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function exportExcel(){
 if(!lastResults.length)return;
 const out=lastResults.map((r,i)=>{
   let x={...r};x['序號']=i+1;
   const codes=handlerTokens(r['業務承辦人證號']), names=handlerTokens(r['業務承辦人姓名']);
   const selectedNames=[];codes.forEach((code,idx)=>{if(lastHandlerCodes.includes(code)){const nm=String(names[idx]??'').trim();if(nm&&!selectedNames.includes(nm))selectedNames.push(nm)}});
   x['業務承辦人證號']=lastHandlerCodes.join(',');x['業務承辦人姓名']=selectedNames.join('、');
   return x;
 });
 let ws=XLSX.utils.json_to_sheet(out);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'查詢結果');XLSX.writeFile(wb,'專案計畫人員保費查詢結果.xlsx');
}
function chineseMoney(n){
 n=Math.round(num(n));if(n===0)return'零元整';const d=['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];const units=['','拾','佰','仟'];
 function section(x){let s='',zero=false;for(let i=0;i<4;i++){let q=x%10;x=Math.floor(x/10);if(q){s=d[q]+units[i]+s;zero=false}else if(s&&!zero){s='零'+s;zero=true}}return s.replace(/^零/,'').replace(/零+/g,'零').replace(/零$/,'')}
 let yi=Math.floor(n/100000000),wan=Math.floor((n%100000000)/10000),yuan=n%10000,s='';if(yi)s+=section(yi)+'億';if(wan)s+=(yi&&wan<1000?'零':'')+section(wan)+'萬';if(yuan)s+=((yi||wan)&&yuan<1000?'零':'')+section(yuan);return s+'元整';
}
async function exportAllocationDocx(){
 if(!lastResults.length)return;
 try{
  const groups=new Map();
  lastResults.forEach(r=>{
   const key=fmtMonth(r['保險年月'])+'||'+String(r['計畫名稱']??'').trim();
   if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);
  });
  const resp=await fetch('./支出科目分攤表範本.docx?'+Date.now());if(!resp.ok)throw new Error('無法讀取支出科目分攤表範本。');
  const zip=await JSZip.loadAsync(await resp.arrayBuffer());const xml=await zip.file('word/document.xml').async('string');
  const parser=new DOMParser(),doc=parser.parseFromString(xml,'application/xml'),body=doc.getElementsByTagName('w:body')[0],sect=body.lastElementChild;
  const base=Array.from(body.childNodes).filter(n=>n!==sect).map(n=>n.cloneNode(true));
  while(body.firstChild)body.removeChild(body.firstChild);
  const groupsArr=Array.from(groups.values());
  groupsArr.forEach((g,idx)=>{
    const month=fmtMonth(g[0]['保險年月']),project=String(g[0]['計畫名稱']??'').trim();
    const total=g.reduce((a,r)=>a+num(r['雇主負擔保費']),0);
    const clones=base.map(n=>n.cloneNode(true));
    replaceTemplate(clones,doc,month,total,project,g);
    clones.forEach(n=>body.appendChild(n));
    if(idx<groupsArr.length-1){
      const WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';const p=doc.createElementNS(WNS,'w:p'),r=doc.createElementNS(WNS,'w:r'),br=doc.createElementNS(WNS,'w:br');br.setAttribute('w:type','page');r.appendChild(br);p.appendChild(r);body.appendChild(p);
    }
  });
  body.appendChild(sect.cloneNode(true));
  const out=new XMLSerializer().serializeToString(doc);zip.file('word/document.xml',out);const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});downloadBlob(blob,'支出科目分攤表.docx');
 }catch(e){console.error(e);alert('匯出支出科目分攤表失敗：'+e.message)}
}
function replaceTemplate(nodes,doc,month,total,project,g){
 const WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const q=(n,tag)=>Array.from(n.getElementsByTagNameNS(WNS,tag));
 const first=(n,tag)=>q(n,tag)[0];
 const text=(n)=>q(n,'t').map(x=>x.textContent||'').join('');
 const applyImportedStyle=(run)=>{
   let rp=first(run,'rPr');if(!rp){rp=doc.createElementNS(WNS,'w:rPr');run.insertBefore(rp,run.firstChild)}
   let rFonts=first(rp,'rFonts');if(!rFonts){rFonts=doc.createElementNS(WNS,'w:rFonts');rp.insertBefore(rFonts,rp.firstChild)}
   rFonts.setAttribute('w:ascii','DFKai-SB');rFonts.setAttribute('w:hAnsi','DFKai-SB');rFonts.setAttribute('w:eastAsia','標楷體');rFonts.setAttribute('w:cs','DFKai-SB');
   let sz=first(rp,'sz');if(!sz){sz=doc.createElementNS(WNS,'w:sz');rp.appendChild(sz)}sz.setAttribute('w:val','24');
   let szCs=first(rp,'szCs');if(!szCs){szCs=doc.createElementNS(WNS,'w:szCs');rp.appendChild(szCs)}szCs.setAttribute('w:val','24');
   let b=first(rp,'b');if(!b){b=doc.createElementNS(WNS,'w:b');rp.appendChild(b)}b.setAttribute('w:val','1');
   let bCs=first(rp,'bCs');if(!bCs){bCs=doc.createElementNS(WNS,'w:bCs');rp.appendChild(bCs)}bCs.setAttribute('w:val','1');
   let c=first(rp,'color');if(!c){c=doc.createElementNS(WNS,'w:color');rp.appendChild(c)}c.setAttribute('w:val','17365D');
 };
 const setParagraphText=(p,value)=>{
   q(p,'t').forEach(t=>t.textContent='');q(p,'br').forEach(br=>br.parentNode.removeChild(br));
   let r=q(p,'r')[0];if(!r){r=doc.createElementNS(WNS,'w:r');p.appendChild(r)}
   let t=first(r,'t');if(!t){t=doc.createElementNS(WNS,'w:t');r.appendChild(t)}
   t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=String(value??'');applyImportedStyle(r);
 };
 const setParagraphLines=(p,lines)=>{
   const oldRuns=q(p,'r');let templateRun=oldRuns[0]||null;
   q(p,'t').forEach(t=>t.textContent='');q(p,'br').forEach(br=>br.parentNode.removeChild(br));
   oldRuns.slice(1).forEach(r=>{q(r,'t').forEach(t=>t.textContent='');q(r,'br').forEach(br=>br.parentNode.removeChild(br));});
   let r=templateRun;if(!r){r=doc.createElementNS(WNS,'w:r');p.appendChild(r)}
   const baseRp=first(r,'rPr')?first(r,'rPr').cloneNode(true):null;while(r.firstChild)r.removeChild(r.firstChild);if(baseRp)r.appendChild(baseRp);
   lines.forEach((line,idx)=>{const rr=idx===0?r:doc.createElementNS(WNS,'w:r');if(idx>0&&baseRp)rr.appendChild(baseRp.cloneNode(true));applyImportedStyle(rr);const t=doc.createElementNS(WNS,'w:t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=String(line??'');rr.appendChild(t);if(idx>0)p.appendChild(rr);if(idx<lines.length-1)rr.appendChild(doc.createElementNS(WNS,'w:br'));});
 };
 const tables=[];function walk(n){if(n.nodeType===1&&n.namespaceURI===WNS&&n.localName==='tbl')tables.push(n);Array.from(n.childNodes||[]).forEach(walk)}nodes.forEach(walk);
 const tbl=tables[0];if(!tbl)throw new Error('Word 範本找不到主要表格。');
 const rows=()=>Array.from(tbl.childNodes).filter(n=>n.nodeType===1&&n.namespaceURI===WNS&&n.localName==='tr');
 let trs=rows();
 // 空白範本實際為 10 列：第 7～9 列（索引 6～8）為可供複製的資料列，第 10 列為合計列。
 const footerRow=trs.findIndex(tr=>text(tr).includes('合計新台幣'));if(footerRow<0)throw new Error('Word 範本找不到合計列。');
 const firstData=6;if(footerRow<=firstData)throw new Error('Word 範本沒有可用的資料列。');
 const sampleRow=trs[firstData].cloneNode(true);
 const cells=row=>q(row,'tc');
 const y=month.slice(0,3),m=month.slice(4,6);
 // 表頭月份與總金額
 const r3=cells(trs[3]);if(r3[1]){const ps=q(r3[1],'p');if(ps[0])setParagraphText(ps[0],y+'年'+m+'月')}
 if(r3[3]){const ps=q(r3[3],'p');if(ps[0])setParagraphText(ps[0],money(total))}
 // 移除範本原有的空白資料列，保留合計列。
 trs=rows();for(let i=footerRow-1;i>=firstData;i--)tbl.removeChild(trs[i]);
 // 建立「保險項目＋預算編號」分組：同項目同預算編號合併，不同預算編號分列。
 const itemGroups=[];const map=new Map();
 g.forEach(r=>{const item=insuranceLabel(r['保險項目']),code=String(r['預算編號']??'').trim();const key=item+'||'+code;if(!map.has(key)){const obj={item,code,rows:[],total:0};map.set(key,obj);itemGroups.push(obj)}const obj=map.get(key);obj.rows.push(r);obj.total+=num(r['雇主負擔保費'])});
 const dataRows=[];
 itemGroups.forEach(obj=>{
   const row=sampleRow.cloneNode(true);const cs=cells(row);
   if(cs[0]){const ps=q(cs[0],'p');if(ps[0])setParagraphText(ps[0],obj.code)}
   if(cs[2]){const ps=q(cs[2],'p');if(ps[0])setParagraphText(ps[0],obj.item)}
   if(cs[3]){const ps=q(cs[3],'p');if(ps[0])setParagraphText(ps[0],money(obj.total))}
   if(cs[4]){const ps=q(cs[4],'p');if(ps[0])setParagraphLines(ps[0],obj.rows.map(r=>String(r['姓名']??'').trim()+' '+money(r['雇主負擔保費'])))}
   dataRows.push(row);
 });
 if(!dataRows.length)throw new Error('查詢結果沒有可匯出的保費資料。');
 // 計畫名稱欄跨所有資料列合併；空白範本的附註欄也跨所有資料列合併。
 dataRows.forEach((row,i)=>{
   const cs=cells(row);
   if(cs[1]){
     const tcPr=cs[1].getElementsByTagNameNS(WNS,'tcPr')[0]||cs[1].insertBefore(doc.createElementNS(WNS,'w:tcPr'),cs[1].firstChild);
     let vm=tcPr.getElementsByTagNameNS(WNS,'vMerge')[0];if(!vm){vm=doc.createElementNS(WNS,'w:vMerge');tcPr.appendChild(vm)}vm.setAttribute('w:val',i===0?'restart':'continue');
     const ps=q(cs[1],'p');if(ps[0])setParagraphText(ps[0],i===0?project:'');
   }
   if(cs[5]){
     const tcPr=cs[5].getElementsByTagNameNS(WNS,'tcPr')[0]||cs[5].insertBefore(doc.createElementNS(WNS,'w:tcPr'),cs[5].firstChild);
     let vm=tcPr.getElementsByTagNameNS(WNS,'vMerge')[0];if(!vm){vm=doc.createElementNS(WNS,'w:vMerge');tcPr.appendChild(vm)}vm.setAttribute('w:val',i===0?'restart':'continue');
     // 保留範本附註文字，只放在第一列。
     if(i>0){const ps=q(cs[5],'p');if(ps[0])setParagraphText(ps[5],'');}
   }
 });
 // 相同保險項目連續時合併「用途別科目名稱」欄。
 let pos=0;while(pos<dataRows.length){const item=itemGroups[pos].item;let end=pos+1;while(end<dataRows.length&&itemGroups[end].item===item)end++;for(let i=pos;i<end;i++){const cs=cells(dataRows[i]);if(cs[2]){const tcPr=cs[2].getElementsByTagNameNS(WNS,'tcPr')[0]||cs[2].insertBefore(doc.createElementNS(WNS,'w:tcPr'),cs[2].firstChild);let vm=tcPr.getElementsByTagNameNS(WNS,'vMerge')[0];if(!vm){vm=doc.createElementNS(WNS,'w:vMerge');tcPr.appendChild(vm)}vm.setAttribute('w:val',i===pos?'restart':'continue')}}pos=end;}
 // 插入資料列至合計列之前。
 const totalRow=rows().find(tr=>text(tr).includes('合計新台幣'));if(!totalRow)throw new Error('找不到合計列。');dataRows.forEach(row=>tbl.insertBefore(row,totalRow));
 // 合計中文大寫。
 const rTotal=cells(totalRow);if(rTotal[1]){const ps=q(rTotal[1],'p');if(ps[0])setParagraphText(ps[0],chineseMoney(total))}
}
function openBudgetPdf(){
 const w=window.open('./薪級及保險費預算表.pdf','_blank');
 if(!w) alert('瀏覽器封鎖了新視窗，請允許本網站開啟新視窗後再試。');
}

function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
</script></body></html>
