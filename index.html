<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案計畫人員_雇主負擔保險費查詢</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f7fb;color:#26364a;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
  .header{background:#12395b;color:#fff;padding:26px 20px;text-align:center}
  .header h1{margin:0;font-size:26px;letter-spacing:.5px}
  .header p{margin:8px 0 0;opacity:.88;font-size:14px}
  .container{max-width:1250px;margin:28px auto;padding:0 18px}
  .card{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(25,55,85,.08);padding:22px;margin-bottom:20px}
  .search-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
  .field{flex:1;min-width:250px}
  label{display:block;font-weight:700;margin-bottom:8px}
  input{width:100%;padding:12px 14px;border:1px solid #c9d4df;border-radius:8px;font-size:16px;outline:none}
  input:focus{border-color:#3977a8;box-shadow:0 0 0 3px rgba(57,119,168,.12)}
  button{border:0;border-radius:8px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;background:#17639a;color:#fff}
  button:hover{background:#104e7c}
  .hint{font-size:13px;color:#6b7785;margin-top:8px}
  .status{padding:13px 15px;border-radius:8px;margin-top:15px;background:#f0f5f9;color:#51606f}
  .status.error{background:#fff1f0;color:#a33a31}
  .status.ok{background:#edf8f1;color:#2d6b43}
  .project{border-left:5px solid #17639a;padding:12px 15px;margin:18px 0 12px;background:#f5f9fc;border-radius:0 8px 8px 0}
  .project-title{font-weight:700;color:#12395b;line-height:1.6}
  .table-wrap{overflow-x:auto;border:1px solid #e0e6ec;border-radius:9px}
  table{border-collapse:collapse;width:100%;min-width:1050px}
  th{background:#e9f0f6;color:#243b53;font-weight:700;white-space:nowrap}
  th,td{padding:10px 9px;border-bottom:1px solid #e6ebef;text-align:center;font-size:14px}
  td:nth-child(2),td:nth-child(3),td:nth-child(9),td:nth-child(10){text-align:left}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#f8fbfd}
  .money{text-align:right!important;white-space:nowrap}
  .summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}
  .badge{background:#eef4f8;border-radius:8px;padding:9px 13px;font-size:14px}
  .badge strong{color:#12395b}
  .empty{padding:30px;text-align:center;color:#77828d}
  .footer{text-align:center;color:#8a96a3;font-size:12px;padding:10px 20px 30px}
  .loading{display:none}
  @media(max-width:600px){
    .header h1{font-size:21px}
    .container{margin-top:16px}
    .card{padding:16px}
    button{width:100%}
  }
</style>
</head>
<body>
<header class="header">
  <h1>專案計畫人員_雇主負擔保險費查詢</h1>
  <p>請輸入業務承辦人身分識別碼（身分證號）後4碼查詢</p>
</header>

<main class="container">
  <section class="card">
    <div class="search-row">
      <div class="field">
        <label for="handler">業務承辦人</label>
        <input id="handler" type="text" maxlength="20" autocomplete="off"
               placeholder="請輸入身分證號後4碼">
        <div class="hint">例如：a002。系統會忽略前後空白及英文大小寫差異。</div>
      </div>
      <button id="searchBtn" type="button">查詢</button>
    </div>
    <div id="status" class="status">資料載入中，請稍候……</div>
  </section>

  <section id="result" class="card" style="display:none"></section>
</main>

<div class="footer">資料來源：資料頁｜本頁面僅提供查詢功能</div>

<script>
const DATA_FILE = "./專案計畫人員保費查詢.xlsx";
const DATA_SHEET = "資料頁";
let allData = [];

const $ = id => document.getElementById(id);
const norm = v => String(v ?? "").trim().toLowerCase();

function fmtMoney(v){
  if(v === null || v === undefined || v === "") return "";
  const n = Number(String(v).replace(/,/g,""));
  return Number.isFinite(n) ? n.toLocaleString("zh-TW") : String(v);
}

function fmtMonth(v){
  if(v === null || v === undefined || v === "") return "";
  const s = String(v).trim();
  if(/^\d{5,6}$/.test(s)){
    const t = s.padStart(6,"0");
    return `${t.slice(0,3)}年${t.slice(3,5)}月`;
  }
  return s;
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function setStatus(text, type=""){
  $("status").className = "status " + type;
  $("status").textContent = text;
}

async function loadData(){
  try{
    const res = await fetch(DATA_FILE + "?v=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[DATA_SHEET];
    if(!ws) throw new Error(`找不到工作表「${DATA_SHEET}」`);
    allData = XLSX.utils.sheet_to_json(ws, {defval:""});
    if(!allData.length) throw new Error("資料頁沒有資料");
    setStatus(`資料載入完成，共 ${allData.length} 筆資料。`, "ok");
  }catch(e){
    console.error(e);
    setStatus("無法載入資料。請確認 Excel 檔案與本 HTML 位於同一資料夾，且網站可讀取該 Excel 檔案。", "error");
  }
}

function search(){
  const key = norm($("handler").value);
  const result = $("result");
  result.style.display = "block";

  if(!key){
    result.innerHTML = '<div class="empty">請先輸入業務承辦人代碼。</div>';
    return;
  }
  if(!allData.length){
    result.innerHTML = '<div class="empty">目前尚未載入資料，請稍後再試。</div>';
    return;
  }

  const rows = allData.filter(r => norm(r["業務承辦人"]) === key);

  if(!rows.length){
    result.innerHTML = `<div class="empty">查無業務承辦人「${esc($("handler").value.trim())}」的資料。</div>`;
    return;
  }

  const groups = new Map();
  rows.forEach(r => {
    const name = String(r["計畫名稱"] ?? "").trim() || "未填列計畫名稱";
    if(!groups.has(name)) groups.set(name, []);
    groups.get(name).push(r);
  });

  let totalLabor = 0, totalRetire = 0, totalHealth = 0;

  let out = `<div class="summary">
    <div class="badge">業務承辦人：<strong>${esc($("handler").value.trim())}</strong></div>
    <div class="badge">查詢筆數：<strong>${rows.length}</strong></div>
    <div class="badge">計畫數：<strong>${groups.size}</strong></div>
  </div>`;

  for(const [project, list] of groups){
    out += `<div class="project"><div class="project-title">專案計畫名稱：${esc(project)}</div></div>`;
    out += `<div class="table-wrap"><table>
      <thead><tr>
        <th>序號</th><th>單位</th><th>姓名</th><th>保險年月</th>
        <th>投保薪額</th><th>勞工保險費</th><th>勞工退休金提繳</th>
        <th>全民健康保險費</th><th>異動</th><th>備註</th>
      </tr></thead><tbody>`;

    list.forEach(r => {
      const labor = Number(r["勞工保險費"]) || 0;
      const retire = Number(r["勞工退休金提繳"]) || 0;
      const health = Number(r["全民健康保險費"]) || 0;
      totalLabor += labor; totalRetire += retire; totalHealth += health;
      out += `<tr>
        <td>${esc(r["序號"])}</td>
        <td>${esc(r["單位"])}</td>
        <td>${esc(r["姓名"])}</td>
        <td>${esc(fmtMonth(r["保險年月"]))}</td>
        <td class="money">${esc(fmtMoney(r["投保薪額"]))}</td>
        <td class="money">${esc(fmtMoney(r["勞工保險費"]))}</td>
        <td class="money">${esc(fmtMoney(r["勞工退休金提繳"]))}</td>
        <td class="money">${esc(fmtMoney(r["全民健康保險費"]))}</td>
        <td>${esc(r["異動"])}</td>
        <td>${esc(r["備註"])}</td>
      </tr>`;
    });
    out += `</tbody></table></div>`;
  }

  const grand = totalLabor + totalRetire + totalHealth;
  out += `<div class="summary">
    <div class="badge">勞保費合計：<strong>${totalLabor.toLocaleString("zh-TW")}</strong></div>
    <div class="badge">勞退提繳合計：<strong>${totalRetire.toLocaleString("zh-TW")}</strong></div>
    <div class="badge">健保費合計：<strong>${totalHealth.toLocaleString("zh-TW")}</strong></div>
    <div class="badge">三項合計：<strong>${grand.toLocaleString("zh-TW")}</strong></div>
  </div>`;

  result.innerHTML = out;
}

$("searchBtn").addEventListener("click", search);
$("handler").addEventListener("keydown", e => {
  if(e.key === "Enter") search();
});
loadData();
</script>
</body>
</html>
